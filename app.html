<title>پنج ستون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header with five pillar bars that fill as work is done; side nav + main column; stacks on phones */
:root{
  --bg:#F2F4EF;--surface:#FFFFFF;--sunk:#E9ECE5;--ink:#1C2A33;--muted:#5B6970;--line:#D5DBD3;
  --pillar:#1F6F78;--pillar-soft:#D4E7E5;--saffron:#C98A12;--saffron-soft:#F6E7C6;
  --danger:#B3413A;--danger-soft:#F5DCD9;--ok:#357548;--ok-soft:#D9EDDF;--warn:#A86F12;--warn-soft:#F7E9CF;
  --display:Lalezar,Vazirmatn,Tahoma,sans-serif;--body:Vazirmatn,Tahoma,"Segoe UI",sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F171C;--surface:#162128;--sunk:#1B2830;--ink:#E4EBE7;--muted:#98A6AC;--line:#2A3942;
  --pillar:#4FB0B6;--pillar-soft:#183739;--saffron:#E3AE4A;--saffron-soft:#3A2E17;
  --danger:#E27A70;--danger-soft:#3D2220;--ok:#6CBF88;--ok-soft:#1C3325;--warn:#E3A548;--warn-soft:#3A2D16;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171C;--surface:#162128;--sunk:#1B2830;--ink:#E4EBE7;--muted:#98A6AC;--line:#2A3942;
  --pillar:#4FB0B6;--pillar-soft:#183739;--saffron:#E3AE4A;--saffron-soft:#3A2E17;
  --danger:#E27A70;--danger-soft:#3D2220;--ok:#6CBF88;--ok-soft:#1C3325;--warn:#E3A548;--warn-soft:#3A2D16;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.85}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
a{color:var(--pillar)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}

header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brandrow{display:flex;align-items:center;gap:14px;padding-block:10px 4px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:30px;line-height:1;color:var(--pillar)}
.logo small{font-family:var(--body);font-size:13px;color:var(--muted);margin-inline-start:8px}
.projbox{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.projbox select{max-width:220px}
.savestate{font-size:12px;color:var(--muted)}
.pillars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding-block:6px 10px}
.pl{border:0;background:var(--sunk);border-radius:6px 6px 2px 2px;height:46px;position:relative;cursor:pointer;padding:0;overflow:hidden;text-align:center}
.pl .fill{position:absolute;inset:auto 0 0 0;background:var(--pillar-soft);transition:height .5s ease}
.pl .lbl{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;height:100%;font-size:12.5px;line-height:1.35}
.pl .lbl b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--pillar)}
.pl.cur{box-shadow:0 0 0 2px var(--saffron) inset}
.pl.done .fill{background:var(--pillar)} .pl.done .lbl, .pl.done .lbl b{color:#fff}

.shell{display:grid;grid-template-columns:220px 1fr;gap:28px;padding-block:24px 60px}
nav.side{position:sticky;top:140px;align-self:start;display:flex;flex-direction:column;gap:2px}
nav.side button{all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;display:flex;justify-content:space-between;gap:8px;color:var(--ink)}
nav.side button:hover{background:var(--sunk)}
nav.side button:focus-visible{outline:2px solid var(--saffron)}
nav.side button.on{background:var(--pillar-soft);color:var(--pillar);font-weight:700}
nav.side .grp{font-size:12px;color:var(--muted);margin:14px 12px 4px;letter-spacing:.02em}
nav.side .badge{font-size:11px;color:var(--muted)}
main{min-width:0}
h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.3;margin:0 0 6px;text-wrap:balance}
h2{font-size:19px;margin:30px 0 10px;line-height:1.5}
h3{font-size:16px;margin:18px 0 6px}
.lead{color:var(--muted);max-width:70ch;margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:0 0 16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--pillar);border-color:var(--pillar);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:3px 10px;font-size:13px}
.note{border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14px}
.note.info{background:var(--pillar-soft)} .note.warn{background:var(--warn-soft)} .note.crit{background:var(--danger-soft)} .note.ok{background:var(--ok-soft)}
.muted{color:var(--muted)} .small{font-size:13px}

.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 18px}
.field{min-width:0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted);min-height:1em}
.field.wide{grid-column:1/-1}
details.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:0 0 12px}
details.grp>summary{cursor:pointer;padding:12px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .muted{font-weight:400;font-size:13px}
details.grp .inner{padding:4px 18px 18px}
.tblwrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
td.num,th.num{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
table.edit input,table.edit select{width:100%;min-width:80px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}

.examples{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ex{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.ex:hover{border-color:var(--pillar)} .ex:focus-visible{outline:2px solid var(--saffron)}
.ex b{font-size:15px} .ex span{font-size:12.5px;color:var(--muted)}
.ex.new{border-style:dashed}

.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:700;line-height:1.4;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--danger)} .kpi.good .v{color:var(--ok)}
.triad{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;margin-bottom:12px}
.triad>div{padding:14px 16px;border-inline-start:1px solid var(--line);min-width:0}
.triad>div:first-child{border-inline-start:0}
.triad .t{font-size:13px;color:var(--muted)}
.triad .big{font-family:var(--display);font-size:30px;line-height:1.3}
.chart svg{width:100%;height:auto;display:block}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:0 0 14px;overflow:hidden}
.sec>header{display:flex;gap:12px;align-items:baseline;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--sunk)}
.sec>header .no{font-family:var(--display);font-size:22px;color:var(--pillar);min-width:24px}
.sec>header .ttl{font-weight:700}
.sec>header .kind{margin-inline-start:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.sec .body{padding:10px 18px 16px;min-width:0}
.sec .body p{margin:8px 0;max-width:78ch}
.sec .body ul,.sec .body ol{margin:6px 0;padding-inline-start:22px}
.chk li{list-style:none;position:relative}
.chk li::before{content:"";position:absolute;right:-20px;top:.55em;width:11px;height:11px;border:1.5px solid var(--muted);border-radius:2px}
.flag{font-size:12.5px;border-radius:6px;padding:4px 8px;margin:6px 0;display:inline-block}
.flag.leak{background:var(--danger-soft)} .flag.nums{background:var(--warn-soft)}
.pending{color:var(--muted);font-size:14px;padding:6px 0}
.prog{margin:0;font-size:14px;padding-inline-start:20px}
.sev{font-size:11.5px;border-radius:5px;padding:1px 7px;white-space:nowrap}
.sev.critical{background:var(--danger);color:#fff}.sev.high{background:var(--danger-soft);color:var(--danger)}
.sev.medium{background:var(--warn-soft);color:var(--warn)}.sev.low{background:var(--sunk);color:var(--muted)}
.verdict{border-radius:var(--radius);padding:18px 22px;margin:0 0 18px;border:1px solid var(--line)}
.verdict .v{font-family:var(--display);font-size:32px;line-height:1.3}
.verdict ul{margin:6px 0 0;padding-inline-start:20px}
.verdict.go{background:var(--ok-soft)} .verdict.cond{background:var(--warn-soft)} .verdict.stop{background:var(--danger-soft)}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--pillar)}
.bar i.low{background:var(--danger)} .bar i.mid{background:var(--saffron)}
.phase{border-inline-start:4px solid var(--pillar);padding:4px 16px;margin:0 0 18px}
.tl{display:inline-flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.tl span{padding:1px 8px;border-radius:5px}
.tl .g{background:var(--ok-soft)} .tl .y{background:var(--warn-soft)} .tl .r{background:var(--danger-soft)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;right:16px;max-width:520px;margin:0 auto;z-index:20;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

@media (max-width:860px){
  .wrap{padding-inline:16px}
  .shell{grid-template-columns:1fr;gap:10px;padding-top:12px}
  nav.side{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px}
  nav.side .grp{display:none}
  nav.side button{white-space:nowrap;background:var(--surface);border:1px solid var(--line)}
  .triad{grid-template-columns:1fr}
  .triad>div{border-inline-start:0;border-top:1px solid var(--line)}
  .triad>div:first-child{border-top:0}
  .pl .lbl span{display:none}
  header.top{position:static}
  .logo small{display:none}
  .brandrow{gap:8px}
  .examples{grid-template-columns:repeat(2,minmax(0,1fr))}
  h1{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <div class="logo">پنج ستون<small>5P · تحلیل هر کسب‌وکار در پنج ستون</small></div>
      <div class="projbox">
        <select id="projSel" aria-label="پروژه‌ها" class="btn"></select>
        <button class="btn" id="newProj">پروژه‌ی جدید</button>
        <button class="btn" id="exportBtn">دانلود گزارش</button>
        <span class="savestate" id="saveState"></span>
      </div>
    </div>

  </div>
</header>

  <div class="shell">
    <nav class="side" id="nav" aria-label="بخش‌ها"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
/* ================= engine (pure, generic for any business) ================= */
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const PEAKS={spring:1,summer:4,autumn:7,winter:10};
const n0=v=>{const x=Number(v);return Number.isFinite(x)?x:0};
function annuity(P,rA,n){if(!(P>0)||!(n>0))return 0;const r=rA/12;if(!r)return P/n;return P*r/(1-Math.pow(1+r,-n))}
function seasonFactors(p){const amp={none:0,low:.12,high:.3}[p.season]||0;const pk=PEAKS[p.peak]??4;return MONTHS.map((_,i)=>1+amp*Math.cos(2*Math.PI*(i-pk)/12))}
function mix(p){
  const staff=p.staff||[];
  const pctStaff=staff.filter(s=>s.payType==='pct').reduce((a,s)=>a+n0(s.amount),0)/100;
  const fixedStaff=staff.filter(s=>s.payType!=='pct').reduce((a,s)=>a+n0(s.amount),0);
  const fixedCosts=(p.fixedCosts||[]).reduce((a,c)=>a+n0(c.amount),0);
  const marketing=(p.fixedCosts||[]).filter(c=>c.mkt).reduce((a,c)=>a+n0(c.amount),0);
  return {pctStaff,fixedStaff,fixedCosts,marketing,fee:n0(p.feePct)/100};
}
/* one month at year-1 prices, average season */
function monthEco(p,units){const m=mix(p);const price=n0(p.price);
  const rev=units*price,fee=rev*m.fee,varC=units*n0(p.varPerUnit),staff=rev*m.pctStaff+m.fixedStaff,fixC=m.fixedCosts;
  const ebitda=rev-fee-varC-staff-fixC;return {units,rev,fee,varC,staff,fixC,ebitda}}
function runEngine(p,ov){
  ov=ov||{};const H=36,m=mix(p),sf=seasonFactors(p);
  const u0=n0(p.currentUnits),uT=n0(p.targetUnits),R=Math.max(1,n0(p.rampMonths)||12),cap0=n0(p.capacity);
  const unitMul=ov.unitMul??1,priceMul=ov.priceMul??1,fixedMul=ov.fixedMul??1,varMul=ov.varMul??1;
  const infl=n0(p.inflation)/100,tax=n0(p.taxPct)/100;
  const initInv=n0(p.initialInvest),cash0=n0(p.startCash);
  const loanAmt=n0(p.loanAmount),loanRate=n0(p.loanRate)/100,loanN=Math.max(0,n0(p.loanMonths));
  const loanPay=annuity(loanAmt,loanRate,loanN),dep=initInv/60;
  let cash=cash0+loanAmt,loanBal=loanAmt,accDep=0,cumInv=-initInv,payback=null,cumNet=0,draws=0;
  const rows=[];
  for(let t=1;t<=H;t++){
    const cal=(n0(p.startMonth)+t-1)%12,yr=Math.floor((t-1)/12),inf=Math.pow(1+infl,yr);
    const demand=Math.max(0,(u0+(uT-u0)*Math.min(1,t/R))*sf[cal]*unitMul);
    const units=cap0>0?Math.min(cap0,demand):demand,capped=cap0>0&&demand>cap0+1e-9;
    const price=n0(p.price)*inf*priceMul;
    const rev=units*price,fee=rev*m.fee,varC=units*n0(p.varPerUnit)*inf*varMul;
    const staff=rev*m.pctStaff+m.fixedStaff*inf,fixC=m.fixedCosts*inf*fixedMul,mkt=m.marketing*inf*fixedMul;
    const ebitda=rev-fee-varC-staff-fixC;
    accDep+=dep;
    const interest=loanBal*loanRate/12;let principal=0;
    if(loanBal>1e-6&&t<=loanN)principal=Math.min(loanBal,loanPay-interest);
    loanBal-=principal;
    const ebt=ebitda-dep-interest,taxv=Math.max(0,ebt)*tax,net=ebt-taxv;
    const draw=Math.max(0,net)*n0(p.ownerDrawPct)/100;
    cash+=net+dep-principal-draw;
    cumInv+=net+dep;if(initInv>0&&payback===null&&cumInv>=0)payback=t;
    cumNet+=net;draws+=draw;
    const fixedAssets=initInv-accDep,equity=initInv+cash0+cumNet-draws;
    const gap=(cash+fixedAssets)-(loanBal+equity);
    rows.push({t,cal,yr,demand,units,capped,price,rev,fee,varC,staff,fixC,mkt,ebitda,dep,interest,tax:taxv,net,principal,draw,cash,loanBal,fixedAssets,equity,gap});
  }
  const years=[0,1,2].map(y=>{const r=rows.filter(x=>x.yr===y);const s=k=>r.reduce((a,x)=>a+x[k],0);const last=r[r.length-1];
    return {y,units:s('units'),rev:s('rev'),ebitda:s('ebitda'),net:s('net'),tax:s('tax'),costs:s('rev')-s('ebitda'),mkt:s('mkt'),cash:last.cash,loanBal:last.loanBal,fixedAssets:last.fixedAssets,equity:last.equity,gap:last.gap}});
  const today=monthEco(p,u0),target=monthEco(p,uT);
  const cpu=n0(p.price)*(1-m.fee-m.pctStaff)-n0(p.varPerUnit);
  const fixedMonthly=m.fixedStaff+m.fixedCosts;
  const bep=cpu>0?fixedMonthly/cpu:Infinity;
  const y1=years[0];
  const roiY1=initInv>0?y1.net/initInv:null;
  const upc=Math.max(0.01,n0(p.unitsPerCustomer)||1),repeat=n0(p.repeatPct)/100;
  const newCust=uT/upc*(1-repeat);
  const cac=newCust>0&&m.marketing>0?m.marketing/newCust:null;
  const cpc=cpu*upc;
  const minCash=rows.reduce((a,r)=>r.cash<a.cash?r:a,rows[0]);
  const sumCheck=years.every((yy,i)=>Math.abs(yy.rev-rows.filter(r=>r.yr===i).reduce((a,r)=>a+r.rev,0))<1);
  const maxGap=Math.max(...rows.map(r=>Math.abs(r.gap)));
  const cappedMonths=rows.filter(r=>r.capped&&r.t<=24).length;
  return {rows,years,today,target,cpu,cpc,bep,fixedMonthly,payback,roiY1,newCust,cac,marketing:m.marketing,minCash,sumCheck,maxGap,cappedMonths,sf};
}
function fa(v){return Math.round(n0(v)).toLocaleString('fa-IR')}
function fa1(v){return n0(v).toLocaleString('fa-IR',{maximumFractionDigits:1})}
function fmtM(v){const x=n0(v);if(Math.abs(x)>=1e9)return (x/1e9).toLocaleString('fa-IR',{maximumFractionDigits:2})+' میلیارد';if(Math.abs(x)>=1e6)return (x/1e6).toLocaleString('fa-IR',{maximumFractionDigits:1})+' میلیون';return Math.round(x).toLocaleString('fa-IR')}
function pct(v){return v===null||v===undefined||!Number.isFinite(v)?'—':(v*100).toLocaleString('fa-IR',{maximumFractionDigits:0})+'٪'}

function engineWarnings(p,E){
  const W=[],u=p.unitName||'واحد';
  if(E.today.ebitda<0)W.push({sev:'high',text:`با فروش فعلی (${fa(p.currentUnits)} ${u} در ماه) ماهانه حدود ${fmtM(-E.today.ebitda)} تومان زیان عملیاتی دارد.`});
  if(n0(p.capacity)>0&&n0(p.targetUnits)>n0(p.capacity))W.push({sev:'high',text:`هدف (${fa(p.targetUnits)} ${u}) از ظرفیت (${fa(p.capacity)} ${u}) بیشتر است.`});
  if(!Number.isFinite(E.bep))W.push({sev:'critical',text:`هر ${u} بعد از کسر هزینه‌های مستقیم ضرر می‌دهد؛ با هیچ حجم فروشی به سربه‌سر نمی‌رسد.`});
  else if(E.bep>n0(p.targetUnits))W.push({sev:'critical',text:`نقطه سربه‌سر (${fa1(E.bep)} ${u}) از هدف فروش بالاتر است.`});
  else if(n0(p.capacity)>0&&E.bep>0.8*n0(p.capacity))W.push({sev:'high',text:`نقطه سربه‌سر (${fa1(E.bep)} ${u}) بیش از ۸۰٪ ظرفیت است؛ حاشیه‌ی امنیت کم است.`});
  if(E.cappedMonths>0)W.push({sev:'medium',text:`در ${fa(E.cappedMonths)} ماه از ۲۴ ماه اول، تقاضا از ظرفیت بیشتر است و فروش سقف می‌خورد.`});
  if(E.cac!==null&&E.cpc>0&&E.cac>E.cpc)W.push({sev:'high',text:`هزینه‌ی جذب هر مشتری جدید (${fmtM(E.cac)}) از سود یک خرید او (${fmtM(E.cpc)}) بیشتر است.`});
  if(E.marketing<=0)W.push({sev:'medium',text:'هیچ بودجه‌ی بازاریابی در هزینه‌ها علامت نخورده است.'});
  if(E.payback===null&&n0(p.initialInvest)>0)W.push({sev:'high',text:'سرمایه‌ی اولیه در ۳۶ ماه برنمی‌گردد.'});
  if(E.minCash.cash<0)W.push({sev:'critical',text:`نقدینگی در ماه ${fa(E.minCash.t)} به ${fmtM(E.minCash.cash)} تومان می‌رسد؛ یعنی پول کم می‌آید و باید پیش از شروع، منبع آن مشخص شود.`});
  (p.reqs||[]).forEach(x=>{if(x.status==='yes')return;
    if(x.critical)W.push({sev:x.status==='no'?'critical':'high',text:`«${x.name}»: ${x.status==='no'?'ندارد':'در حال اقدام'} (الزام اجباری${x.status==='no'?'، مانع پیش از اجرا':''}).`});
    else W.push({sev:'medium',text:`«${x.name}»: ${x.status==='no'?'ندارد':'در حال اقدام'}.`})});
  if(!E.sumCheck)W.push({sev:'critical',text:'خطای داخلی: جمع ماه‌ها با سال برابر نیست.'});
  if(E.maxGap>1)W.push({sev:'critical',text:'خطای داخلی: ترازنامه تراز نیست.'});
  return W;
}
function detScores(p,E){
  const clamp=v=>Math.max(0,Math.min(100,v));const y1=E.years[0];const margin=y1.rev>0?y1.net/y1.rev:-1;
  const a=clamp(margin/0.25*100);
  const cap=n0(p.capacity)||n0(p.targetUnits)*1.25;
  const b=Number.isFinite(E.bep)&&cap>0?clamp((0.9-E.bep/cap)/0.6*100):0;
  const c=n0(p.initialInvest)<=0?100:E.payback===null?0:clamp((42-E.payback)/30*100);
  const d=E.today.ebitda>=0?100:clamp(40+E.today.ebitda/Math.max(1,E.fixedMonthly)*40);
  const e=E.minCash.cash>=0?100:0;
  const fin=Math.round((a+b+c+d+e)/5);
  const rq=p.reqs||[];const legal=rq.length?Math.round(rq.reduce((s,x)=>s+(x.status==='yes'?100:x.status==='wip'?50:0),0)/rq.length):null;
  return {fin,parts:{margin:Math.round(a),bep:Math.round(b),payback:Math.round(c),today:Math.round(d),cash:e},legal,
    blockers:rq.filter(x=>x.critical&&x.status==='no').map(x=>x.name),pendingCritical:rq.filter(x=>x.critical&&x.status==='wip').map(x=>x.name)};
}

function lineChart(series,labels,opts){opts=opts||{};const W=720,H=230,P={l:60,r:14,t:14,b:30};
  const all=series.flatMap(s=>s.data);let mn=Math.min(0,...all),mx=Math.max(1,...all);if(mx===mn)mx=mn+1;
  const x=i=>P.l+(W-P.l-P.r)*i/Math.max(1,labels.length-1),y=v=>P.t+(H-P.t-P.b)*(1-(v-mn)/(mx-mn));
  const NS='http://www.w3.org/2000/svg';const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('role','img');svg.setAttribute('aria-label',opts.label||'نمودار');
  const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);svg.append(e);return e};
  for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4;mk('line',{x1:P.l,x2:W-P.r,y1:y(v),y2:y(v),stroke:'var(--line)','stroke-width':1});const tx=mk('text',{x:P.l-6,y:y(v)+4,'text-anchor':'end','font-size':11,fill:'var(--muted)'});tx.textContent=opts.fmt?opts.fmt(v):fa(v)}
  if(mn<0)mk('line',{x1:P.l,x2:W-P.r,y1:y(0),y2:y(0),stroke:'var(--muted)','stroke-width':1.2});
  labels.forEach((l,i)=>{if(i%Math.ceil(labels.length/8)===0){const tx=mk('text',{x:x(i),y:H-8,'text-anchor':'middle','font-size':11,fill:'var(--muted)'});tx.textContent=l}});
  series.forEach(s=>{const d=s.data.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');mk('path',{d,fill:'none',stroke:s.color,'stroke-width':2.4,'stroke-linejoin':'round','stroke-dasharray':s.dash||'none'});
    const li=s.data.length-1;mk('circle',{cx:x(li),cy:y(s.data[li]),r:3.5,fill:s.color})});
  const lg=el('div',{class:'row small muted'},series.map(s=>el('span',null,el('span',{style:`display:inline-block;width:14px;height:3px;background:${s.color};vertical-align:middle;margin-inline-end:6px`}),s.name)));
  return el('div',{class:'chart'},svg,lg)}

function renderBlocks(blocks){return (blocks||[]).map(b=>{try{

  if(b.t==='table')return table((b.head||[]).map(String),(b.rows||[]).map(r=>(r||[]).map(c=>String(c??''))));
  if(b.t==='note')return el('div',{class:'note '+(b.tone==='warn'?'warn':'info'),text:String(b.text||'')});
  return el('p',{text:String(b.text||'')});}catch(e){return null}})}
function blocksText(blocks){return (blocks||[]).map(b=>b.t==='table'?[(b.head||[]).join(' | '),...(b.rows||[]).map(r=>(r||[]).join(' | '))].join('\n'):b.items?b.items.join('\n'):String(b.text||'')).join('\n')}
function normDigits(s){return s.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/[٬,](?=\d{3})/g,'')}
function knownNumbers(){const set=[];const push=v=>{v=Math.abs(n0(v));if(v>0)set.push(v)};
  const walk=(o,scale)=>{if(o==null)return;if(typeof o==='number'){push(o);if(scale)push(o*1e6)}else if(Array.isArray(o))o.forEach(x=>walk(x,scale));else if(typeof o==='object')Object.values(o).forEach(x=>walk(x,scale))};
  walk(S.profile,false);const ef=engineForPrompt();delete ef.هشدارها;walk(ef,true);return set}
function numberFlags(text){const t=normDigits(text);const known=knownNumbers();const out=[];const re=/(\d+(?:\.\d+)?)\s*(میلیارد|میلیون|هزار|٪|%)?/g;let m;
  while((m=re.exec(t))){const x=parseFloat(m[1]);const unit=m[2]||'';
    if(!unit&&x<1000)continue;if(!unit&&x>=1390&&x<=1420)continue;if(!unit&&x>=2020&&x<=2040)continue;
    const c=unit==='میلیارد'?[x*1e9,x]:unit==='میلیون'?[x*1e6,x]:unit==='هزار'?[x*1e3,x]:unit?[x,x/100]:[x];
    if(!c.some(v=>known.some(k=>Math.abs(k-v)<=Math.max(0.02*k,0.051))))out.push(m[0].trim())}
  return [...new Set(out)].slice(0,8)}
function leakFlags(text){const own=S.profile.name+' '+S.profile.city;const words=[];
  return [...new Set(words)].filter(w=>text.includes(w))}

const RULES=`تو تحلیلگر ارشد کسب‌وکار هستی و بخشی از یک گزارش حرفه‌ای فارسی را برای مالک یک کسب‌وکار کوچک می‌نویسی. این کسب‌وکار می‌تواند از هر نوعی باشد؛ متن را دقیقاً برای «نوع کسب‌وکار» پرونده بنویس.
قوانین قطعی:
۱. هیچ عدد مالی نساز. فقط اعداد «موتور» یا «پرونده» را به کار ببر (مبالغ موتور به میلیون تومان است؛ بنویس «۳۴٫۲ میلیون تومان»). اگر عددی لازم است و نیست، بنویس [داده لازم: ...].
۲. هیچ تحقیق، مصاحبه، آمار بازار یا منبعی را که در پرونده نیامده ادعا نکن. هر فرض را با «(فرض)» علامت بزن و بگو چطور سنجیده شود.
۳. درباره‌ی رقبا فقط از اطلاعات پرونده و با لحن بی‌طرف بنویس.
۴. لحن حرفه‌ای، ساده و بدون اغراق. از «کاملاً شدنی» و «بی‌ریسک» پرهیز کن.
۵. محدودیت‌های کشور را رعایت کن و ابزاری را که در کشور مالک قابل استفاده نیست توصیه نکن.
۶. هشدارهای موتور واقعی‌اند؛ در بخش‌های مرتبط منعکس‌شان کن.
۷. مرز ستون را رعایت کن: موضوع ستون دیگر را فقط خلاصه کن و ارجاع بده.`;
const FORMAT=`فقط یک شیء JSON برگردان، بدون هیچ متن دیگری:
{"sections":[{"no":شماره بخش,"blocks":[...]}]}
انواع بلوک: {"t":"p","text":"..."} | {"t":"list","items":["..."]} | {"t":"steps","items":["..."]} | {"t":"check","items":["..."]} | {"t":"table","head":["..."],"rows":[["..."]]} | {"t":"note","tone":"warn","text":"..."}
برای هر بخش ۲ تا ۵ بلوک. متن‌ها فارسی، کوتاه و دقیق.`;
function context(){const c=COUNTRIES[S.profile.country]||COUNTRIES.OT;
  return `# کشور و محدودیت‌ها\n${c.label}: ${c.notes}\n\n# پرونده کسب‌وکار (داده‌ی مالک)\n${JSON.stringify(profileForPrompt())}\n\n# خروجی موتور مالی (تنها منبع مجاز اعداد مالی)\n${JSON.stringify(engineForPrompt())}`}
function genPrompt(col,chunk){
  return `${RULES}\n\n${context()}\n\n# ستون ${col.id}: ${col.title}\nهدف ستون: ${col.purpose}\nمرز ستون: ${col.boundary}\n\n# بخش‌هایی که باید بنویسی\n${chunk.map(s=>`## بخش ${s.no}: ${s.t}\nهدف: ${s.ex}\nباید شامل باشد: ${(s.must||[]).join('؛ ')}${s.k==='mix'?'\n(جدول موتور این بخش جدا نمایش داده می‌شود؛ تکرارش نکن، فقط تفسیر کن.)':''}`).join('\n\n')}\n\n# قالب خروجی\n${FORMAT}`}
function colText(cid){const col=COLS.find(c=>c.id===cid);const o=S.out[cid]||{};return col.sections.filter(s=>o[s.no]).map(s=>`## ${s.no}. ${s.t}\n${blocksText(o[s.no].blocks)}`).join('\n\n').slice(0,40000)}
function reviewPrompt(cid){const col=COLS.find(c=>c.id===cid);const o=S.out[cid]||{};
  const flags=col.sections.filter(s=>o[s.no]&&(o[s.no].nums.length||o[s.no].leak.length)).map(s=>`بخش ${s.no}: اعداد بدون منبع [${o[s.no].nums.join('، ')}] ${o[s.no].leak.length?'نشت نام: '+o[s.no].leak.join('، '):''}`);
  return `تو بازبین سخت‌گیر گزارش‌های کسب‌وکار هستی. ستون «${col.title}» را ارزیابی کن.
معیارها: سازگاری با اعداد موتور؛ نبود داده یا تحقیق ساختگی؛ واقع‌گرایی؛ کاربردی بودن برای این نوع کسب‌وکار؛ رعایت محدودیت‌های کشور؛ بی‌طرفی.
ضعف‌های خود کسب‌وکار (مثل زیان امروز یا مجوز ناقص) را هم به‌عنوان issue گزارش کن، نه فقط ضعف متن.

${context()}

# پرچم‌های خودکار
${flags.join('\n')||'ندارد'}

# متن ستون
${colText(cid)}

{"score":عدد ۰ تا ۱۰۰,"issues":[{"severity":"critical|high|medium|low","section":شماره,"text":"..."}],"strengths":["..."],"summary":"دو جمله"}`}
function planPrompt(){const E=S.E;const path=E.rows.slice(0,12).map(r=>({ماه:calName(r.t),فروش:Math.round(r.units*10)/10,سود_خالص_میلیون:Math.round(r.net/1e5)/10}));
  const issues=Object.entries(S.reviews).flatMap(([cid,r])=>(r.issues||[]).map(i=>`[ستون ${cid}][${i.severity}] ${i.text}`)).slice(0,25);const V=verdict();
  return `${RULES}

«برنامه‌ی پیشرفت» عملی بنویس: مسیر از امروز به هدف در چهار مرحله: ۳۰ روز، ۶۰ روز، ۹۰ روز و تا ۱۲ ماه.
هر مرحله: هدف روشن، ۳ تا ۵ اقدام (با مسئول و شماره‌ی ستون مرتبط از ۱ تا ۵)، و ۲ تا ۳ شاخص با آستانه‌ی سبز/زرد/قرمز.
اول موانع پیش از اجرا (الزامات اجباری ناقص)، کمبود نقدینگی و زیان امروز را هدف بگیر. قوانین توقف یا تغییر مسیر را با عدد بنویس.

${context()}

# مسیر ۱۲ ماهه‌ی مدل
${JSON.stringify(path)}
# حکم فعلی
${V.label}: ${V.why.join('؛ ')}
# مشکلات بازبینی ستون‌ها
${issues.join('\n')||'بازبینی هنوز انجام نشده'}

فقط یک JSON برگردان:
{"headline":"یک جمله","phases":[{"title":"۳۰ روز اول","goal":"...","actions":[{"text":"...","owner":"...","column":1}],"kpis":[{"name":"...","green":"...","yellow":"...","red":"..."}]}],"stop_rules":["..."]}`}

/* ================= Claude calls ================= */
async function getSample(){if(SAMPLE)return SAMPLE;if(!window.claude||!window.claude.use)return null;SAMPLE_P=SAMPLE_P||window.claude.use('sample');SAMPLE=await SAMPLE_P;return SAMPLE}
const ERR={not_granted:'اجازه‌ی استفاده از Claude داده نشد. برای نوشتن متن، صفحه را دوباره باز کنید و اجازه بدهید.',rate_limited:'درخواست‌ها زیاد شد. یک دقیقه صبر کنید و دوباره بزنید.',invalid_json:'پاسخ Claude قابل خواندن نبود. دوباره امتحان کنید.',cancelled:'متوقف شد.',prompt_too_large:'داده‌ها برای یک درخواست زیاد است.'};
const errText=e=>ERR[e&&e.code]||('خطا: '+((e&&e.message)||e));
function setProg(items){S.progress=items;const b=$('progBox');if(b)b.replaceChildren(progressList());else render()}
function progressList(){return el('ul',{class:'prog'},(S.progress||[]).map(x=>el('li',null,el('strong',{text:x.label+': '}),x.st)))}

async function writeColumn(cid,prog){const col=COLS.find(c=>c.id===cid);const sample=await getSample();if(!sample)throw {message:'Claude در این نما در دسترس نیست؛ صفحه را داخل Claude باز کنید.'};
  const ai=col.sections.filter(s=>s.k!=='engine');const chunks=[];for(let i=0;i<ai.length;i+=4)chunks.push(ai.slice(i,i+4));
  S.out[cid]={};delete S.reviews[cid];
  for(let i=0;i<chunks.length;i++){prog.st=`نوشتن (${fa(i+1)} از ${fa(chunks.length+1)})…`;setProg(S.progress);
    const res=await sample.json(genPrompt(col,chunks[i]),{signal:CTL.signal,modelTier:'default'});
    for(const s of (res&&res.sections)||[]){const no=n0(s.no);if(!chunks[i].some(c=>c.no===no))continue;const txt=blocksText(s.blocks);S.out[cid][no]={blocks:s.blocks||[],nums:numberFlags(txt),leak:leakFlags(txt)}}}
  prog.st=`بازبینی (${fa(chunks.length+1)} از ${fa(chunks.length+1)})…`;setProg(S.progress);
  const r=await sample.json(reviewPrompt(cid),{signal:CTL.signal,modelTier:'default'});
  S.reviews[cid]={score:Math.max(0,Math.min(100,n0(r.score))),issues:Array.isArray(r.issues)?r.issues:[],strengths:Array.isArray(r.strengths)?r.strengths:[],summary:String(r.summary||'')};
  prog.st=`تمام شد · امتیاز ${fa(S.reviews[cid].score)}`;setProg(S.progress);await saveOut(cid)}
async function writePlan(prog){const sample=await getSample();if(!sample)throw {message:'Claude در این نما در دسترس نیست.'};
  prog.st='در حال نوشتن…';setProg(S.progress);
  const r=await sample.json(planPrompt(),{signal:CTL.signal,modelTier:'default'});
  S.plan={headline:String(r.headline||''),phases:Array.isArray(r.phases)?r.phases:[],stop_rules:Array.isArray(r.stop_rules)?r.stop_rules:[],at:Date.now()};
  prog.st='تمام شد';setProg(S.progress);await savePlan()}
async function runJob(steps){if(S.busy)return;S.busy=true;CTL=new AbortController();if(DB&&!S.fresh){clearTimeout(saveTimer);queue(saveProj)}
  S.progress=steps.map(s=>({label:s.label,st:'در صف',fn:s.fn}));render();
  try{for(const pr of S.progress){await pr.fn(pr)}toast('انجام شد.')}
  catch(e){toast(errText(e));const k=S.progress.find(x=>/…$/.test(x.st));if(k)k.st=e&&e.code==='cancelled'?'متوقف شد':'خطا'}
  finally{S.busy=false;CTL=null;render()}}
const jobColumn=cid=>runJob([{label:`ستون ${fa(cid)}: ${COLS[cid-1].title}`,fn:pr=>writeColumn(cid,pr)}]);
const jobPlan=()=>runJob([{label:'برنامه پیشرفت',fn:writePlan}]);
const jobAll=()=>runJob([...COLS.map(c=>({label:`ستون ${fa(c.id)}: ${c.title}`,fn:pr=>writeColumn(c.id,pr)})),{label:'برنامه پیشرفت',fn:writePlan}]);

/* ================= verdict ================= */
function verdict(){const D=S.D;const why=[];let cls='go',label='اجرا';
  const rev=COLS.map(c=>S.reviews[c.id]?S.reviews[c.id].score:null).filter(v=>v!==null);
  const parts=[D.fin,...rev];if(D.legal!==null)parts.push(D.legal);const avg=Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
  if(D.blockers.length){cls='stop';label='مانع پیش از اجرا';why.push('الزام اجباری که وجود ندارد: '+D.blockers.join('، '))}
  if(S.E.minCash.cash<0){if(cls!=='stop'){cls='stop';label='کمبود نقدینگی'}why.push(`نقدینگی در ماه ${fa(S.E.minCash.t)} منفی می‌شود`)}
  if(D.pendingCritical.length){if(cls==='go'){cls='cond';label='اجرا با شرط'}why.push('الزام اجباری در حال اقدام: '+D.pendingCritical.join('، '))}
  if(D.fin<50){if(cls==='go'){cls='cond';label='اصلاح مدل مالی'}why.push(`امتیاز مالی ${fa(D.fin)} زیر کف ۵۰`)}
  if(cls==='go'){if(avg<55){cls='stop';label='بازطراحی'}else if(avg<70){cls='cond';label='اجرا با اصلاحات'}}
  why.push(`میانگین امتیازها ${fa(avg)} از ۱۰۰`+(rev.length<5?` (${fa(5-rev.length)} ستون هنوز نوشته و بازبینی نشده)`:''));
  return {cls,label,why,avg}}

let saveTimer=null,saving=Promise.resolve();
function setSave(t){$('saveState').textContent=t}
function colPath(){return 'data/users/'+UID}
function queue(fn){saving=saving.then(fn).catch(e=>{setSave('ذخیره نشد');console.warn(e)});return saving}
function scheduleSave(){if(!DB||S.fresh)return;setSave('تغییرات ذخیره نشده');clearTimeout(saveTimer);saveTimer=setTimeout(()=>queue(saveProj),1500)}
async function saveProj(){if(!DB)return;setSave('در حال ذخیره…');await DB.collection(colPath()).doc('proj_'+S.pid).set({name:S.profile.name,profile:S.profile,exampleKey:S.exampleKey||null,updatedAt:Date.now()});setSave('ذخیره شد');refreshProjList(false)}
function saveOut(cid){if(!DB)return Promise.resolve();return queue(async()=>{await DB.collection(colPath()).doc(`out_${S.pid}_${cid}`).set({out:S.out[cid]||{},review:S.reviews[cid]||null,updatedAt:Date.now()});setSave('ذخیره شد')})}
function savePlan(){if(!DB)return Promise.resolve();return queue(async()=>{await DB.collection(colPath()).doc(`plan_${S.pid}`).set({plan:S.plan,updatedAt:Date.now()});setSave('ذخیره شد')})}
async function refreshProjList(loadLatest){if(!DB)return;try{const snap=await DB.collection(colPath()).get();
  S.projects=snap.docs.filter(d=>d.id.startsWith('proj_')).map(d=>({id:d.id.slice(5),name:(d.data()||{}).name||'بی‌نام',at:(d.data()||{}).updatedAt||0})).sort((a,b)=>b.at-a.at);
  renderProjSel();if(loadLatest&&S.projects.length)await loadProject(S.projects[0].id)}catch(e){console.warn(e)}}
async function loadProject(pid){if(!DB)return;const col=DB.collection(colPath());const data=(await col.doc('proj_'+pid).get()).data();if(!data)return;
  S.pid=pid;S.profile=Object.assign(clone(BASE),data.profile);S.exampleKey=data.exampleKey||null;S.out={};S.reviews={};S.plan=null;S.progress=null;
  for(const c of COLS){const o=(await col.doc(`out_${pid}_${c.id}`).get()).data();if(o){S.out[c.id]=o.out||{};if(o.review)S.reviews[c.id]=o.review}}
  const pl=(await col.doc(`plan_${pid}`).get()).data();if(pl)S.plan=pl.plan;
  S.fresh=false;recompute();renderProjSel();setSave('بارگذاری شد');render()}
function renderProjSel(){const sel=$('projSel');sel.replaceChildren();const list=S.projects.some(x=>x.id===S.pid)||S.fresh?S.projects:[{id:S.pid,name:S.profile.name},...S.projects];
  if(S.fresh)sel.append(el('option',{value:'',text:'پروژه‌های ذخیره‌شده…'}));list.forEach(x=>sel.append(el('option',{value:x.id,selected:x.id===S.pid?true:null,text:x.name})));sel.hidden=list.length<(S.fresh?1:2)}
function startProject(key){if(S.busy)return;S.pid=newId();S.profile=makeProfile(key);S.exampleKey=key||null;S.out={};S.reviews={};S.plan=null;S.progress=null;S.fresh=false;recompute();S.view='profile';renderProjSel();render();if(DB)queue(saveProj);window.scrollTo({top:0})}

  const hint=el('div',{class:'hint'});const upd=()=>{if(opt.money)hint.textContent=n0(p[key])?fmtM(p[key])+' تومان':''};

  if(type==='select')input=el('select',{id,onchange:e=>onch(e.target.value)},Object.entries(opt.options).map(([k,v])=>el('option',{value:k,selected:String(p[key])===String(k)?true:null,text:v})));
  else if(type==='textarea'){input=el('textarea',{id,oninput:e=>onch(e.target.value)});input.value=p[key]||''}

  upd();return el('div',{class:'field'+(opt.wide?' wide':'')},el('label',{for:id,text:label}),input,opt.help?el('div',{class:'hint',text:opt.help}):hint)}
function editTable(key,cols,blank){const p=S.profile;p[key]=p[key]||[];const wrap=el('div');

    if(c.type==='select')inp=el('select',{id,onchange:e=>set(e.target.value),'aria-label':c.label},Object.entries(c.options).map(([k,v])=>el('option',{value:k,selected:row[c.key]===k?true:null,text:v})));
